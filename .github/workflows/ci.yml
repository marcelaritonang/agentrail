name: ci

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentrail_test
          POSTGRES_USER: agentrail
          POSTGRES_PASSWORD: agentrail
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agentrail -d agentrail_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_POSTGRES_URL: postgresql://agentrail:agentrail@localhost:5433/agentrail_test
      TEST_REDIS_URL: redis://localhost:6379
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY: agentrail-local
      TEST_S3_SECRET_KEY: agentrail-local-secret

    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start S3-compatible integration service
        run: >-
          docker run -d --name agentrail-minio-ci
          -p 9000:9000
          -e MINIO_ROOT_USER=agentrail-local
          -e MINIO_ROOT_PASSWORD=agentrail-local-secret
          quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          server /data
      - name: Wait for S3-compatible service
        run: |
          for attempt in $(seq 1 30); do
            if docker exec agentrail-minio-ci mc ready local; then exit 0; fi
            sleep 1
          done
          docker logs agentrail-minio-ci
          exit 1
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:infra
      - run: pnpm build
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file infra/aws/template.yaml
      - run: pnpm test:e2e
      - run: pnpm test:e2e:cli
      - run: pnpm test:e2e:cloud
      - run: pnpm test:npm:tarball

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentrail_test
      POSTGRES_USER: agentrail
      POSTGRES_PASSWORD: agentrail
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentrail -d agentrail_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agentrail-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agentrail-redis-data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: agentrail-local
      MINIO_ROOT_PASSWORD: agentrail-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - agentrail-minio-data:/data

volumes:
  agentrail-postgres-data:
  agentrail-redis-data:
  agentrail-minio-data:
